name: Python checks
on:
  pull_request:
  push:
    branches: [main, 'sprint2/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      NO_ALBUMENTATIONS_UPDATE: '1'
      MPLCONFIGDIR: /tmp/security-ai-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=75,<81' wheel
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
