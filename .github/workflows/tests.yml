name: Python checks
on:
  pull_request:
  push:
    branches: [main, 'sprint2/**', 'sprint3/**']
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      NO_ALBUMENTATIONS_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-windows-dev.lock
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1 libglib2.0-0
      - name: Install locked dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip 'setuptools>=75,<81' wheel
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Install locked dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip 'setuptools>=75,<81' wheel
          python -m pip install --require-hashes -r requirements-windows-dev.lock
          python -m pip install --no-deps -e .
      - name: Parse Windows launcher without running hardware
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/run-local.ps1'), [ref]$Tokens, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count -gt 0) { throw 'PowerShell launcher has syntax errors' }
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m security_ai doctor
